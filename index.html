<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, orientation=landscape">
    <title>Okey Pro: İdeal Boyutlar</title>
    <style>
        /* --- GENEL AYARLAR --- */
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { 
            background-color: #050505; color: #ecf0f1; 
            touch-action: pan-x pan-y; user-select: none; -webkit-user-select: none;
            overflow: hidden; 
        }

        /* --- DİKEY (PORTRAIT) UYARISI --- */
        #dikey-uyari {
            display: none; flex-direction: column; justify-content: center; align-items: center;
            height: 100vh; width: 100vw; background: linear-gradient(135deg, #16222a 0%, #3a6073 100%);
            color: white; font-size: 20px; font-weight: 600; text-align: center; padding: 20px; z-index: 9999;
        }
        .dondur-ikon { font-size: 50px; margin-bottom: 15px; animation: dondur 2s infinite ease-in-out; }
        @keyframes dondur { 0% { transform: rotate(0deg); } 50% { transform: rotate(-90deg); } 100% { transform: rotate(-90deg); } }

        @media screen and (orientation: portrait) {
            #dikey-uyari { display: flex; }
            #oyun-konteyner { display: none !important; }
        }

        /* --- ANA KONTEYNER --- */
        #oyun-konteyner {
            display: flex; flex-direction: column; height: 100vh; width: 100vw;
        }

        /* --- 1. ÜST BİLGİ BARI --- */
        .ust-bilgi {
            background: linear-gradient(180deg, #1a1a1a 0%, #0a0a0a 100%);
            padding: 5px 15px; display: flex; justify-content: space-between; align-items: center;
            font-weight: 600; font-size: 12px; color: #d4af37; border-bottom: 1px solid #222; flex-shrink: 0;
        }
        #durum-metni { font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; }

        /* --- 2. OYUN MASASI (Zarif ve İdeal Boyut) --- */
        .masa { 
            background: radial-gradient(circle at center, #114a24 0%, #061c0c 100%);
            border-bottom: 3px solid #030a05; flex-grow: 1; 
            display: flex; flex-direction: column; justify-content: center;
            box-shadow: inset 0 0 40px rgba(0,0,0,0.8); padding: 5px;
        }
        
        .masa-grid {
            display: grid; grid-template-columns: 1fr auto 1fr; grid-template-rows: auto auto auto;
            gap: 6px; align-items: center; justify-items: center;
            max-width: 500px; margin: 0 auto; width: 100%;
        }

        .oyuncu-kutusu {
            background: rgba(0,0,0,0.4); padding: 4px; border-radius: 6px; 
            text-align: center; border: 1px solid #2a2a2a; width: 65px; transition: all 0.2s;
        }
        .aktif-oyuncu { border-color: #f39c12; background: rgba(243, 156, 18, 0.15); box-shadow: 0 0 8px rgba(243, 156, 18, 0.3); }
        .oyuncu-isim { font-size: 9px; margin-bottom: 3px; color: #bbb; font-weight: bold; letter-spacing: 0.5px;}
        
        .vurgu-cek { border: 1px dashed #2ecc71; animation: pulse-green 1.5s infinite; cursor: pointer; }
        .vurgu-birak { border: 1px dashed #e74c3c; animation: pulse-red 1.5s infinite; cursor: pointer; }
        @keyframes pulse-green { 0%{box-shadow: 0 0 0 rgba(46,204,113,0);} 50%{box-shadow: 0 0 8px rgba(46,204,113,0.5);} 100%{box-shadow: 0 0 0 rgba(46,204,113,0);} }
        @keyframes pulse-red { 0%{box-shadow: 0 0 0 rgba(231,76,60,0);} 50%{box-shadow: 0 0 8px rgba(231,76,60,0.5);} 100%{box-shadow: 0 0 0 rgba(231,76,60,0);} }

        .orta-alan {
            grid-column: 2; grid-row: 2; display: flex; gap: 12px; 
            background: rgba(0,0,0,0.4); padding: 6px 12px; border-radius: 8px; border: 1px solid #1a1a1a;
        }

        /* Masadaki Mini Taşlar */
        .tas-mini {
            width: 28px; height: 40px; background: linear-gradient(180deg, #fffdf2 0%, #e8e4c9 100%);
            border-radius: 4px; display: flex; justify-content: center; align-items: center;
            font-weight: 800; font-size: 15px; border: 1px solid #888;
            box-shadow: 1px 2px 3px rgba(0,0,0,0.6); margin: 0 auto; transition: transform 0.2s;
        }
        .tas-mini.bos { background: rgba(0,0,0,0.3); border: 1px dashed #555; box-shadow: none; }
        .tas-ters { background: linear-gradient(180deg, #ffffff 0%, #d8d3bc 100%); border: 1px solid #aaa; color: transparent !important; }
        .secili-masa-tasi { border: 2px solid #f1c40f !important; box-shadow: 0 0 10px rgba(241, 196, 15, 0.8) !important; transform: scale(1.1); z-index: 50; }

        /* --- 3. ALT BÖLÜM (Istaka + Kontroller) --- */
        .alt-bolum {
            display: flex; flex-direction: row; height: 135px; /* Sabit ideal yükseklik */
            background: #150a05; flex-shrink: 0;
        }

        /* ISTAKA ALANI */
        .istaka-alani {
            background: #2b1408; padding: 8px;
            border-top: 4px solid #140903; box-shadow: inset -5px 10px 15px rgba(0,0,0,0.6);
            flex-grow: 1; display: flex; flex-direction: column; justify-content: center;
        }
        
        .istaka-izgara {
            display: grid; grid-template-columns: repeat(12, 1fr); 
            grid-template-rows: 1fr 1fr; gap: 4px; 
            height: 100%; max-width: 800px; margin: 0
